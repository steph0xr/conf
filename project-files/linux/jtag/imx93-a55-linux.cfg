# i.MX93 for Linux kernel debugging: the SoC part shared by the adapter cfgs
# (imx93-evk-jlink.cfg, imx93-evk.cfg). Source it after the adapter / transport lines.

# no reset lines: OpenOCD never resets the board, it only attaches to the running kernel
reset_config none

# --- SoC: 2 x Cortex-A55 (+ M33, AHB-AP), from imx93.cfg (OpenOCD Gerrit change 8353, NXP) ---
set CHIPNAME imx93
# CHIPCORES 1 (openocd -c 'set CHIPCORES 1' -f ..., nvim <leader>mG): core 0 only, for U-Boot and
# early kernel boot, when core 1 is still off (with both, every breakpoint must also go on core 1,
# which fails while it is off -> gdb can't continue). Default 2: both cores, once Linux is up.
if { ![info exists CHIPCORES] } { set CHIPCORES 2 }
source [file join [file dirname [info script]] imx93.cfg]

if { $CHIPCORES > 1 } {
    # both A55 as one SMP target: one gdb port (:3333), the cores are gdb threads (hwthread),
    # halting stops both, breakpoints apply to both
    target smp imx93.a55.0 imx93.a55.1
    imx93.a55.0 configure -rtos hwthread
    imx93.a55.1 configure -rtos hwthread

    # core 1 is off in U-Boot and early boot (until the kernel's smp_init): its examination at start
    # fails, it stays out of halt / breakpoints (needs OpenOCD with jtag/openocd-smp-skip-unexamined.patch:
    # upstream would fail every breakpoint). Each time core 0 halts, try again: once Linux has started
    # core 1 it is examined (+ core 0's breakpoints copied); from the next halt on it is halted with core 0
    # and shows up as a gdb thread.
    proc imx93_core1_examine {} {
        if { [imx93.a55.1 was_examined] } { return }
        if { [catch { imx93.a55.1 arp_examine }] } { return }
        # not halted here: it joins halt / resume from the next halt on (a halt now could land after
        # the resume of a gdb detach and leave the board stopped)
        echo "imx93.a55.1: core 1 is up, examined"
        imx93_core1_copy_bps
    }

    # the hardware breakpoints gdb set while core 1 was off are on core 0 only, and gdb does not
    # insert them again (they are "inserted" for it): copy them to core 1, or code that the scheduler
    # moves to core 1 after smp_init (kernel_init too) would run past them. OpenOCD adds breakpoints
    # to all SMP cores at once: SMP off for the moment, add on core 1 only, SMP on again.
    proc imx93_core1_copy_bps {} {
        set cur [target current]
        targets imx93.a55.0
        set list [bp]
        set bps {}
        foreach line [split $list "\n"] {
            if { [regexp {Hardware breakpoint\(IVA\): addr=(0x[0-9a-fA-F]+), len=(0x[0-9a-fA-F]+)} $line -> addr len] } {
                lappend bps $addr $len
            }
        }
        if { [llength $bps] } {
            imx93.a55.0 aarch64 smp off
            targets imx93.a55.1
            set n 0
            foreach {addr len} $bps {
                if { ![catch { bp $addr $len hw }] } { incr n }
            }
            targets imx93.a55.0
            imx93.a55.0 aarch64 smp on
            echo "imx93.a55.1: $n of [expr {[llength $bps] / 2}] hardware breakpoints copied from core 0"
        }
        targets $cur
    }
    imx93.a55.0 configure -event halted { imx93_core1_examine }
}

# gdb detach / disconnect (nvim-dap: stop the session) -> the kernel runs again
# (OpenOCD leaves the cores halted otherwise)
imx93.a55.0 configure -event gdb-detach { resume }

# gdb "run" / restart over extended-remote (vRun / R packet; cppdbg sends one after connecting
# unless launchCompleteCommand = "None") runs ocd_gdb_restart = "reset halt" in OpenOCD, which here
# resets the whole board (then SPL, U-Boot, autoboot ...). Attach only: just halt.
proc ocd_gdb_restart {target_id} {
    echo "gdb restart / run ignored (attach only, no board reset): halt"
    halt
}

# gdb "break" -> hardware breakpoints (6 on the A55): software breakpoints need writes to the
# kernel text, which the MMU maps read-only (NXP AN14367: "use hard breakpoints")
gdb breakpoint_override hard

# only the A55 for gdb: no extra servers for the M33 / AHB-AP (still usable from the OpenOCD shell)
imx93.m33 configure -gdb-port disabled
imx93.ahb configure -gdb-port disabled

# telnet localhost 4444: OpenOCD shell (targets, halt, resume, reg, mdw ...)
