# i.MX93 11x11 EVK, JTAG with a SEGGER J-Link (BASE V11) on the board's JTAG connector,
# for kernel debugging: attach to the running Linux, halt / breakpoints / step, no reset.
#
#   openocd -f jtag/imx93-evk-jlink.cfg        (nvim: <leader>mg, then <leader>dc -> "Linux JTAG")
#
# No bcu step: leave remote_en at 0 (power-up default), so the on-board FT4232H does not drive
# the JTAG lines. Quit JLinkExe / J-Link GDB Server first (one program owns the probe).
# Needs OpenOCD built with the jlink driver (libjaylink-dev, ./configure --enable-jlink).
# For our own board with a J-Link: the same file, without "EVK" in the name.

adapter driver jlink
# this probe only (when more J-Links are connected)
adapter serial 51014607
transport select jtag
# kHz; the J-Link can go higher, raise it once the connection is stable
adapter speed 4000

source [file join [file dirname [info script]] imx93-a55-linux.cfg]
