# i.MX93 11x11 EVK, JTAG through the on-board FT4232H (debug USB J1401), for kernel debugging:
# attach to the running Linux, halt / breakpoints / step, no reset.
#
#   openocd -f jtag/imx93-evk.cfg        (nvim: <leader>mg, then <leader>dc -> "Linux JTAG")
#
# Before (once per board power-up): the FT4232H only reaches the SoC's JTAG pins in "remote mode",
# switched by an I2C GPIO expander on the board, with NXP's bcu tool (https://github.com/nxp-imx/bcu):
#   bcu set_gpio remote_en 1 -board=imx93evk11
# Close the console / kdmx first (bcu uses the same FTDI chip).
#
# Based on OpenOCD Gerrit change 8353 (NXP): interface/ftdi/nxp/imx93-evk.cfg + board/nxp/imx93-evk*.cfg

# --- adapter: FT4232H channel A (ttyUSB0 / if00; the A55 console stays on channel C, if02) ---
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0
# TCK/TDI/TMS outputs, TDO input; nSRST is not on the FTDI (bcu reset ... only)
ftdi layout_init 0x0008 0x000b

transport select jtag
adapter speed 1000
source [file join [file dirname [info script]] imx93-a55-linux.cfg]
